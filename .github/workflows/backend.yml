name: Backend tests

on:
  push:
    branches: [main]
    paths: ["saket-portfolio/backend/**", "saket-portfolio/knowledge/**", "saket-portfolio/public/resume.pdf", "saket-portfolio/api/**", "saket-portfolio/requirements*.txt"]
  pull_request:
    paths: ["saket-portfolio/backend/**", "saket-portfolio/knowledge/**", "saket-portfolio/public/resume.pdf", "saket-portfolio/api/**", "saket-portfolio/requirements*.txt"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saket-portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: saket-portfolio/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Knowledge base is up to date with resume.pdf and knowledge/
        run: python -m backend.ingest --check
      - name: Unit, API and retrieval-quality tests
        run: python -m pytest -q
